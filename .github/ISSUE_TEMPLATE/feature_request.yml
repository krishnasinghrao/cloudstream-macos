name: Feature Request
description: Suggest an idea or enhancement for CloudStream for macOS
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make CloudStream for macOS better? We'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific problem or friction point?
      placeholder: I am always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or workflow you'd like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
